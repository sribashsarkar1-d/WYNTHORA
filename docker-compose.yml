version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: core_postgres
    environment:
      POSTGRES_USER: world_sim
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: world_sim_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U world_sim -d world_sim_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin for Development
  pgadmin:
    image: dpage/pgadmin4
    container_name: core_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@worldsim.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Redis for Caching, Sessions, and Asynq Jobs
  redis:
    image: redis:7-alpine
    container_name: core_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus for Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: core_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  # Grafana for Metrics Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: core_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

  # Jaeger for OpenTelemetry Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: core_jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "14268:14268" # jaeger.thrift
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core_api
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - DB_URL=postgres://world_sim:secretpassword@postgres:5432/world_sim_db?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_PATH=./uploads
    depends_on:
      - postgres
      - redis

  # Asynq Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core_worker
    environment:
      - ENVIRONMENT=development
      - DB_URL=postgres://world_sim:secretpassword@postgres:5432/world_sim_db?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    # Using the same binary, but in production we'd use a CLI flag to run only the worker
    # For now, it runs the full server which includes the worker in a goroutine

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
