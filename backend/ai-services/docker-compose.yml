version: '3.8'

services:
  ai-services:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/wynthora_ai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=password
      - SECRET_KEY=enterprise-secret-key-change-me
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wynthora-network

  celery-worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info -Q default,ml_queue,sim_queue
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/wynthora_ai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=password
      - SECRET_KEY=enterprise-secret-key-change-me
    depends_on:
      - redis
      - db
    networks:
      - wynthora-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=wynthora_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wynthora-network

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wynthora-network

volumes:
  postgres_data:

networks:
  wynthora-network:
    driver: bridge
